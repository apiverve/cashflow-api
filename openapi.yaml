openapi: 3.0.4
info:
  title: Cash Flow Statement
  description: >-
    Cash Flow Statement returns operating, investing and financing cash flows
    for a US public company by ticker - straight from SEC filings, with free
    cash flow, FCF margin and cash-conversion metrics calculated for you.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/cashflow:
    get:
      summary: Cash Flow Statement
      description: >-
        Get the cash flow statement for a company by ticker symbol. Optionally
        filter to a specific fiscal year and quarter.
      operationId: cashflow
      parameters:
        - name: ticker
          in: query
          schema:
            type: string
          required: true
          description: Stock ticker symbol (e.g. AAPL, MSFT, ADBE)
          example: AAPL
        - name: year
          in: query
          schema:
            type: integer
          required: false
          description: >-
            Fiscal year to retrieve. Defaults to latest available. History
            covers only the quarters captured so far; a missing period answers
            404 listing the available ones.
        - name: quarter
          in: query
          schema:
            type: integer
          required: false
          description: Fiscal quarter to retrieve. Defaults to latest available.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  ticker: AAPL
                  company: Apple Inc.
                  cik: '0000320193'
                  fiscalYear: 2025
                  fiscalQuarter: 4
                  filingType: 10-K
                  filingDate: '2025-10-31'
                  periodEnd: '2025-09-27'
                  cashFlow:
                    operatingCashFlow: 111482000000
                    capitalExpenditures: 12715000000
                    investingCashFlow: 15195000000
                    financingCashFlow: -120686000000
                    dividendsPaid: 15421000000
                    shareRepurchases: 90711000000
                    freeCashFlow: 98767000000
                  metrics:
                    fcfMargin: 23.73
                    operatingCashFlowMargin: 26.79
                    capexToRevenue: 3.06
                    cashFlowToNetIncome: 1
                    dividendPayoutRatio: 13.77
                    fcfPerShare: 6.5824
                  formatted:
                    operatingCashFlow: $111.48B
                    freeCashFlow: $98.77B
                    capitalExpenditures: $12.71B
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
